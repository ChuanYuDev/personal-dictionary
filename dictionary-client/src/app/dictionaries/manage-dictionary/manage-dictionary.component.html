<div class="container">
    
    <app-page-header [backRoute]="['/']" title="Manage Dictionary"></app-page-header>

    @if (nameErrors().length > 0) {
        <app-display-errors
            title="Unable to load dictionary info."
            [errors]="nameErrors()"
        >
        </app-display-errors>
    } @else {
        <div class="name-section">
            @if (name(); as name) {
                <div class="font-weight-medium">
                    Dictionary name
                </div>

                <div class="name-row">

                    <div class="name-value">
                        {{ name }}
                    </div>

                    <app-update-dictionary-name
                        [name]="name"
                        (updated)="loadMetadata()"
                    ></app-update-dictionary-name>
                </div>
            } @else {
                Loading...
            }
            
        </div>
    }
    
    <div class="id-container">
        <div class="font-weight-medium">
            Dictionary Id
        </div>

        <div>
            {{ dictionaryState()?.dbId }}
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <app-download-dictionary [name]="name()"></app-download-dictionary>
        </div>

        <div class="col-12">
            <app-open-dictionary buttonText="Open Another Dictionary" (opened)="navigateToHome()"></app-open-dictionary>
        </div>

        <div class="col-12">
            <app-create-dictionary (created)="navigateToHome()"></app-create-dictionary>
        </div>
        
        <div class="col-12">
            <app-connect-dictionary (connected)="navigateToHome()"></app-connect-dictionary>
        </div>
        
        <div class="col-12">
            <button type="button" class="button" (click)="disconnectDictionary()">
                Disconnect Dictionary
            </button>
        </div>
    </div>
</div>
