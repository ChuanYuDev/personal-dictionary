<div class="container">
    
    <app-page-header [backRoute]="['/']" title="Manage Dictionary"></app-page-header>

    Connected dictionary:

    <div class="name-container">
        {{ dictionaryState()?.dbName }}
        <button type="button" class="icon-button" (click)="renameDictionaryDialog.showModal()">
            <mat-icon>edit</mat-icon>
        </button>
    </div>
    

    <div class="row">
        <div class="col-12">
            <app-download-dictionary></app-download-dictionary>
        </div>

        <div class="col-12">
            <app-open-dictionary buttonText="Open Another Dictionary" (opened)="navigateToHome()"></app-open-dictionary>
        </div>

        <div class="col-12">
            <app-create-dictionary (created)="navigateToHome()"></app-create-dictionary>
        </div>
        
        <div class="col-12">
            <button type="button" class="button" (click)="disconnectDictionary()">
                Disconnect Dictionary
            </button>
        </div>
    </div>
</div>

<app-dialog #renameDictionaryDialog
    title="Rename Dictionary"
    confirmButtonText="Save"
    confirmButtonStyle="primary"
    [confirmButtonDisabled]="formGroup.invalid"
>
    <form [formGroup]="formGroup">
        <div class="form-field">
            <input [formControl]="formGroup.controls.name" aria-label="name">
            
            <div class="form-error">
                {{ getErrorMessagesForName() }}
            </div>
        </div>
    </form>
</app-dialog>
