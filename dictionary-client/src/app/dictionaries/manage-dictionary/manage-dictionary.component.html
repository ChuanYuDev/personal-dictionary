<div class="container">
    
    <div class="page-header flex-center">
        <a routerLink="/" class="unstyled-link back-link flex-center">
            <mat-icon>chevron_left</mat-icon>
        </a>
        <h1 class="page-title">Manage Dictionary</h1>
    </div>

    <p>Connected dictionary:</p>

    <p>{{ dictionaryState()?.dbName }} </p>
    <button type="button"> &#9998; </button>

    <div class="row">
        <div class="col-12">
            <app-download-dictionary></app-download-dictionary>
        </div>

        <div class="col-12">
            <app-open-dictionary buttonText="Open Another Dictionary" (opened)="navigateToHome()"></app-open-dictionary>
        </div>

        <div class="col-12">
            <app-create-dictionary (created)="navigateToHome()"></app-create-dictionary>
        </div>
        
        <div class="col-12">
            <button type="button" class="button" (click)="disconnectDictionary()">
                Disconnect Dictionary
            </button>
        </div>
    </div>
</div>
