<div class="container">
    <div class="home-header">
        <h1 class="page-title">My Dictionary</h1>
        
        @if (dictionaryState()) {
            <a routerLink="dictionaries/manage" class="navigation-link">
                {{dictionaryState()?.dbName}} 
                <mat-icon>chevron_right</mat-icon>
            </a>
        }
    </div>

    @if (!dictionaryState()) {
        <p>No dictionary connected</p>
    
        <div class="row">
            <div class="col-12">
                <app-open-dictionary buttonText="Open Existing Dictionary"></app-open-dictionary>
            </div>

            <div class="col-12">
                <app-create-dictionary></app-create-dictionary>
            </div>
        </div>
    }
    
    <app-favorite [(isFavorite)]="isFavorite"></app-favorite>
    
    {{ isFavorite() }}
    
    <app-favorite [isFavorite]="isFavorite2()" ></app-favorite>

    {{ isFavorite2() }}
    
    <app-favorite [isFavorite]="isFavorite2()" [readonlyMode]="true"></app-favorite>

    {{ isFavorite2() }}

    @for (entryDto of entryDtos; track entryDto.id) {
        <app-entry-card [entryDto]="entryDto"></app-entry-card>
    }
</div>
