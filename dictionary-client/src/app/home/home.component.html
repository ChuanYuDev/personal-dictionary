<div class="container home-container">
    <div class="home-header">
        <h1 class="page-title">My Dictionary</h1>
        
        @if (dictionaryState()) {
            <a routerLink="dictionaries/manage" class="unstyled-link">
                {{dictionaryState()?.dbName}} 
                <mat-icon>chevron_right</mat-icon>
            </a>
        }
    </div>

    <div class="home-content">
        @if (dictionaryState()) {
            <app-index-entry></app-index-entry>
        } @else {
            <p>No dictionary connected</p>

            <div class="row">
                <div class="col-12">
                    <app-open-dictionary buttonText="Open Existing Dictionary"></app-open-dictionary>
                </div>

                <div class="col-12">
                    <app-create-dictionary></app-create-dictionary>
                </div>
            </div>
        }
    </div>
</div>
