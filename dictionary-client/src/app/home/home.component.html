<h1>My Dictionary</h1>

@if (dictionaryState()) {
    <a routerLink="dictionaries/manage">{{dictionaryState()?.dbName}} &rsaquo;</a>
} @else {
    <p>No dictionary connected</p>
    
    <div class="container">
        <div class="row">
            <button type="button" class="col-12">
                Open Existing Dictionary
            </button>

            <button
                    type="button"
                    class="col-12"
                    [disabled]="isCreating()"
                    (click)="CreateDictionary()"
            >
                {{isCreating()? "Creating...": "Create New Dictionary"}}
            </button>
        </div>
    </div>
}
