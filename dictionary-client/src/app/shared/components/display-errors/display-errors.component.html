@if (errors().length > 0) {
    <div class="error_container">
        <mat-icon>error_outline</mat-icon>
        
        <div>
            @if (title(); as titleString) {
                <div class="font-weight-medium">
                    {{ titleString }}
                </div>
            }
            
            <ul>
                @for (error of errors(); track $index) {
                    <li>{{ error }}</li>
                }
            </ul>
        </div>
    </div>
}
