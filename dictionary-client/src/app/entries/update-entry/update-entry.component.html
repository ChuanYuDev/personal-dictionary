<div class="container">
    <app-page-header [backRoute]="['/entries', id()]" title="Edit Entry">
        @if (entryDetailsDto()) {
            <app-favorite [(isFavorite)]="isFavorite"></app-favorite>
        }
    </app-page-header>

    @if (entryDetailsDto()) {
        <app-entry-form [entryDetailsDto]="entryDetailsDto()" (postForm)="saveChanges($event)"></app-entry-form>
        
        <hr>
        
        <div class="page-title">
            Delete Entry
        </div>
        
        <div class="content-container">
            Permanently delete this entry
        </div>
        
        <div class="button-container">
            <div class="row">
                <div class="col-6">
                    <button type="button" class="button danger" (click)="deleteDialog.showModal()">
                        Delete
                    </button>
                </div>
            </div>
        </div>
        
    } @else {
        Loading...
    }
    
</div>

<app-dialog
    #deleteDialog
    title="Delete Entry"
    content="This action cannot be undone."
    confirmButtonText="Delete"
    confirmButtonStyle="danger"
    (confirmed)="delete()"
>
</app-dialog>
