<div class="container">
    <app-page-header [backRoute]="['/entries', id()]" title="Edit Entry">
        @if (entryDetailsDto()) {
            <app-favorite [(isFavorite)]="isFavorite"></app-favorite>
        }
    </app-page-header>

    @if (entryDetailsDto()) {
        <app-entry-form [entryDetailsDto]="entryDetailsDto()" (postForm)="saveChanges($event)"></app-entry-form>
        
        <hr>
        
        <div class="page-title">
            Delete Entry
        </div>
        
        Permanently delete this entry
        
        <div class="button-container">
            <div class="row">
                <div class="col-6">
                    <button type="button" class="button" (click)="deleteDialog.showModal()">
                        Delete
                    </button>
                </div>
            </div>
        </div>
        
    } @else {
        Loading...
    }
    
    <app-dialog #deleteDialog></app-dialog>
</div>
