<div class="container">
    <app-page-header [backRoute]="backRoute()" title="Edit Entry">
        @if (entryDetailsDto()) {
            <app-favorite [(isFavorite)]="isFavorite"></app-favorite>
        }
    </app-page-header>

    @if (errors().length > 0) {
        <app-display-errors [errors]="errors()"></app-display-errors>
    } @else {
        @if (entryDetailsDto()) {
            <app-entry-form
                [entryDetailsDto]="entryDetailsDto()"
                [saveButtonDisabled]="isUpdating()"
                [cancelRoute]="backRoute()"
                (postForm)="saveChanges($event)"
            >
                <app-display-errors [errors]="saveErrors()"></app-display-errors>
            </app-entry-form>

            <hr>

            <app-delete-entry [id]="id()"></app-delete-entry>
        } @else {
            Loading...
        }
    }

</div>
