<div class="card-container">
    <div class="card-header">
        <div>
            {{ entrySummaryDto().term }} {{ entrySummaryDto().pronunciation}}
        </div>

        <app-favorite [isFavorite]="entrySummaryDto().isFavorite" [readonlyMode]="true"></app-favorite>
        
    </div>

    <div class="text-nowrap">
        @if (entrySummaryDto().category.name === "word") {
            {{ entrySummaryDto().partOfSpeech }} &middot;
        }

        {{entrySummaryDto().meaning}}
    </div>
</div>
