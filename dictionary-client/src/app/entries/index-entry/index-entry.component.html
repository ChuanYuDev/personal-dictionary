<div class="index-entry-container">
    <app-entry-search-form
        [entrySearchFilterDto]="entrySearchFilterDto()"
        [totalCount]="totalCount()"
        (entrySearchFilterDtoChange)="onEntrySearchFilterDtoChange($event)"
    ></app-entry-search-form>

    <div class="entries-container">
        @if (errors().length > 0) {
            <app-display-errors [errors]="errors()"></app-display-errors>
        } @else {
            @if (entrySummaryDtos(); as entrySummaryDtosArray) {
                @for (entrySummaryDto of entrySummaryDtosArray; track entrySummaryDto.id) {
                    <a [routerLink]="['/entries', entrySummaryDto.id]" class="unstyled-link"
                    >
                        <app-entry-card [entrySummaryDto]="entrySummaryDto" >
                        </app-entry-card>
                    </a>
                }

                <app-paginator
                    [page]="page()"
                    [pageCount]="pageCount()"
                    (pageChange)="onPageChange($event)"
                ></app-paginator>
            } @else {
                Loading...
            }
        }
        
        <div class="version-container">
            Version: {{version()}}
        </div>
    </div>
    
    <a routerLink="/entries/create" class="unstyled-link add-item flex-center">
        <mat-icon>add_circle_outline</mat-icon>
    </a>
</div>
