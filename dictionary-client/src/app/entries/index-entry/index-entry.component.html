<div class="index-entry-container">
    <app-entry-search></app-entry-search>

    <cdk-virtual-scroll-viewport
        itemSize="106"
        class="entries-container"
        (scrolledIndexChange)="handleScrollIndex($event)"
    >
        <a
            [routerLink]="['/entries', entrySummaryDto.id]"
            *cdkVirtualFor="let entrySummaryDto of entrySummaryDtos"
            class="unstyled-link"
        >
            <app-entry-card [entrySummaryDto]="entrySummaryDto" >
            </app-entry-card>
        </a>
        
        <div class="footer">
            End of entries
        </div>
    </cdk-virtual-scroll-viewport>
    
    <a routerLink="/entries/create" class="unstyled-link right-bottom-float">
        <mat-icon>add_circle_outline</mat-icon>
    </a>
</div>
