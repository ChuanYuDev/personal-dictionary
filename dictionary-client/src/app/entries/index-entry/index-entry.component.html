<div class="index-entry-container">
    <app-entry-search-form [(entrySearchFilterDto)]="entrySearchFilterDto" [totalCount]="totalCount()"></app-entry-search-form>

    <div class="entries-container">
        @for (entrySummaryDto of entrySummaryDtos(); track entrySummaryDto.id) {
            <a [routerLink]="['/entries', entrySummaryDto.id]" class="unstyled-link"
            >
                <app-entry-card [entrySummaryDto]="entrySummaryDto" >
                </app-entry-card>
            </a>
        }
        
        <app-paginator [(page)]="page" [totalCount]="totalCount()" [pageSize]="pageSize"></app-paginator>
    </div>
    
    
    <a routerLink="/entries/create" class="unstyled-link right-bottom-float flex-center">
        <mat-icon>add_circle_outline</mat-icon>
    </a>
</div>
