<div class="container">
    <app-page-header [backRoute]="backRoute" title="Create Entry">
        <app-favorite [(isFavorite)]="isFavorite"></app-favorite>
    </app-page-header>
    
    <app-entry-form
        [saveButtonDisabled]="isCreating()"
        [cancelRoute]="backRoute"
        (postForm)="saveChanges($event)"
    >
        <app-display-errors [errors]="errors()"></app-display-errors>
    </app-entry-form>
</div>
