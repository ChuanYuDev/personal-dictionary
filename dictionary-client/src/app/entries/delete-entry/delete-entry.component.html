<div class="page-title title-container">
    Delete Entry
</div>

<div class="content-container">
    Permanently delete this entry
</div>

<div class="row">
    <div class="col-6">
        <button type="button" class="button danger" (click)="openDialog()">
            Delete
        </button>
    </div>
</div>

<app-dialog
    title="Delete Entry"
    content="This action cannot be undone."
    confirmButtonText="Delete"
    confirmButtonStyle="danger"
    (confirmed)="delete()"
>
    <app-display-errors [errors]="errors()"></app-display-errors>
</app-dialog>
