<div class="page-title">
    Delete Entry
</div>

<div class="content-container">
    Permanently delete this entry
</div>

<div class="button-container">
    <div class="row">
        <div class="col-6">
            <button type="button" class="button danger" (click)="deleteDialog.showModal()">
                Delete
            </button>
        </div>
    </div>
</div>

<app-dialog
    #deleteDialog
    title="Delete Entry"
    content="This action cannot be undone."
    confirmButtonText="Delete"
    confirmButtonStyle="danger"
    (confirmed)="delete()"
>
</app-dialog>
